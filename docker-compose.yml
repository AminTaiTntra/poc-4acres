services:
  db:
    image: postgis/postgis:15-3.4
    environment:
      POSTGRES_DB: fouracres
      POSTGRES_USER: fouracres
      POSTGRES_PASSWORD: fouracres_dev
    ports: ["5434:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fouracres -d fouracres"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    ports: ["8080:8080"]
    env_file: .env
    volumes:
      - ./secrets:/secrets:ro
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/fouracres
      SPRING_DATASOURCE_USERNAME: fouracres
      SPRING_DATASOURCE_PASSWORD: fouracres_dev
      GEO_ENGINE_URL: http://frontend:3000/api
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_MAPBOX_TOKEN: ${MAPBOX_TOKEN}
        NEXT_PUBLIC_API_URL: http://localhost:8080
    ports: ["3000:3000"]
    env_file: .env
    environment:
      GEE_SERVICE_ACCOUNT_KEY: /secrets/gee-sa-key.json
    volumes:
      - ./secrets:/secrets:ro
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on: [api]

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@4acres.dev
      PGADMIN_DEFAULT_PASSWORD: admin
    ports: ["5050:80"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
