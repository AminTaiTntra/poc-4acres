# New data-integration API configuration (existing clients remain in application.yml)

# Mapbox — token from .env MAPBOX_TOKEN (shared with frontend)
app.mapbox.base-url=https://api.mapbox.com
app.mapbox.access-token=${MAPBOX_TOKEN}

# WeatherAPI.com — key from .env WEATHERAPI_KEY
app.weatherapi.base-url=https://api.weatherapi.com
app.weatherapi.api-key=${WEATHERAPI_KEY}

# Copernicus Data Space — no auth for STAC catalog
app.sentinel.base-url=https://catalogue.dataspace.copernicus.eu

# Google Dynamic World V1 via Earth Engine REST API
#   GEE_PROJECT_ID              — Google Cloud project registered for Earth Engine (e.g. "my-ee-project")
#   GEE_SERVICE_ACCOUNT_JSON    — raw service-account key JSON, or a path to the key file
# Both unset → land-cover insight is reported as UNAVAILABLE; the rest of the payload is unaffected.
app.dynamicworld.base-url=https://earthengine.googleapis.com
app.dynamicworld.gee-project=${GEE_PROJECT_ID:}
app.dynamicworld.service-account-json=${GEE_SERVICE_ACCOUNT_JSON:}
app.dynamicworld.probability-threshold=0.5
app.dynamicworld.history-years=2016,2017,2018,2019,2020,2021,2022,2023,2024,2025,2026
