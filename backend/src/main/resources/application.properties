# New data-integration API configuration (existing clients remain in application.yml)

# Mapbox — token from .env MAPBOX_TOKEN (shared with frontend)
app.mapbox.base-url=https://api.mapbox.com
app.mapbox.access-token=${MAPBOX_TOKEN:}

# WeatherAPI.com — key from .env WEATHERAPI_KEY (optional; WeatherApiClient
# falls back to defaults when the key is blank, same pattern as GFW_API_KEY below)
app.weatherapi.base-url=https://api.weatherapi.com
app.weatherapi.api-key=${WEATHERAPI_KEY:}

# Copernicus Data Space — no auth for STAC catalog
app.sentinel.base-url=https://catalogue.dataspace.copernicus.eu

# Google Earth Engine (water + terrain) — no official Java SDK, so these calls are
# proxied through Next.js API routes (frontend/app/api/water, /terrain) which hold
# the actual Earth Engine JS client. Auth there uses the .env GEE_PROJECT_ID /
# GEE_SERVICE_ACCOUNT_JSON, already provisioned for this project.
app.geoengine.base-url=${GEO_ENGINE_URL:http://localhost:3000/api}
